# Gradle 自身配置
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# 1.21.1 必须用 Java 21 编译/运行；这里直接指到本机已安装的 JDK 21，
# 避免 toolchain 去网上重新拉一份。
org.gradle.java.installations.paths=C:\\Program Files\\Java\\java21.0.3

## Environment Properties

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 21.1.x 对应 Minecraft 1.21.1
neo_version=21.1.219
neo_version_range=[21.1.0,)
# FML (javafml) 语言加载器的版本范围
loader_version_range=[4,)

