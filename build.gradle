plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge 21.1.x = Minecraft 1.21.1；使用官方（Mojang）映射，
    // 与车万女仆发布版 jar 的编译映射一致，因此可以直接把 TLM 的 jar 当编译依赖用。
    version = project.neo_version

    // 校验 accesstransformer（本模组暂未使用，占位便于后续扩展）
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    // 本地 flatDir：存放车万女仆 1.21.1 NeoForge 发布 jar（见 libs/README.md）
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // TLM 是硬依赖（必装前置），只编译期引用，不打进本模组的 jar。
    // 发布版 jar 用官方映射编译，与 NeoForge 开发环境的命名一致，无需 deobf。
    implementation files('libs/touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar')
}

// TLM 的 jar 属第三方产物，不入库。缺了它编译会失败，这里提前给一条能看懂的提示。
def tlmJar = file('libs/touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar')
tasks.named('compileJava').configure {
    doFirst {
        if (!tlmJar.exists()) {
            throw new GradleException(
                    "缺少车万女仆编译依赖：libs/${tlmJar.name}\n" +
                    "它是硬前置（1.5.3-neoforge+mc1.21.1），不入库；下载方式见 libs/README.md")
        }
    }
}

// 把 gradle.properties 里的占位符替换进 neoforge.mods.toml / pack.mcmeta
tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            tlm_version            : tlm_version,
            tlm_version_range      : tlm_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

// GameTest 的结构模板必须位于「世界目录」下的 gameteststructures/。
// 仓库内的 gameteststructures/ 是唯一事实源，运行前自动同步。
afterEvaluate {
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doFirst {
            file('gameteststructures').exists() && ['run/gameteststructures', 'run/world/gameteststructures'].each { dest ->
                copy {
                    from rootProject.file('gameteststructures')
                    into rootProject.file(dest)
                }
            }
        }
    }
}
